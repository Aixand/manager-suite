schema = 2
profile = "workspace"
# Product releases use SemVer; Python wheels use the equivalent 0.1.0b0.

[workspace]
name = "manager-suite"
version = "0.1.0-beta"
default-product = "manager-suite"
targets = ["linux-x86_64-gnu", "linux-arm64-gnu", "macos-x86_64", "macos-arm64", "windows-x86_64-msvc"]

[commands]
doctor = [["{python}", "-B", "scripts/suite.py", "doctor"]]
develop = [["{python}", "-B", "scripts/suite.py", "develop"]]
check = [["{python}", "-B", "scripts/suite.py", "check"]]
test = [["{python}", "-B", "scripts/suite.py", "test"]]

[components.mcp-manager]
adapter = "payload"
manifest = "pyproject.toml"
path = "mcp-manager"
dependencies = []
build = [["{python}", "-B", "{root}/scripts/product_payload.py", "wheel", "--source", "{source}", "--output", "{output}", "--target", "{target}"]]

[components.prompt-manager]
adapter = "payload"
manifest = "pyproject.toml"
path = "prompt-manager"
build = [["{python}", "-B", "{root}/scripts/product_payload.py", "wheel", "--source", "{source}", "--output", "{output}", "--target", "{target}"]]

[components.skill-manager]
adapter = "payload"
manifest = "pyproject.toml"
path = "skill-manager"
dependencies = ["prompt-manager"]
build = [["{python}", "-B", "{root}/scripts/product_payload.py", "wheel", "--source", "{source}", "--output", "{output}", "--target", "{target}"]]

[components.conversation-manager]
adapter = "payload"
manifest = "pyproject.toml"
path = "conversation-manager"
dependencies = ["agent-manager"]
build = [["{python}", "-B", "{root}/scripts/product_payload.py", "wheel", "--source", "{source}", "--output", "{output}", "--target", "{target}"]]

[components.agent-manager]
adapter = "payload"
manifest = "pyproject.toml"
path = "agent-manager"
dependencies = []
build = [["{python}", "-B", "{root}/scripts/product_payload.py", "wheel", "--source", "{source}", "--output", "{output}", "--target", "{target}"]]

[components.mcp-manager-dependencies]
adapter = "payload"
build = [["{python}", "-B", "{root}/scripts/product_payload.py", "dependencies", "--profile", "mcp-manager", "--output", "{output}", "--target", "{target}"]]

[products."manager-suite/mcp-manager"]
release-tag = "aixand-mcp-manager/v{version}"
adapter = "python"
version = "0.1.0-beta"
components = ["mcp-manager", "mcp-manager-dependencies"]
dependencies = []
python = "3.12.14"
runtimes = ["python"]
stateful = true
verification = [["{command:mcp-manager}", "--help"], ["{python}", "-I", "{payload}/share/manager-suite/mcp-manager/verify.py"]]

[products."manager-suite/mcp-manager".commands.mcp-manager]
program = "bin/mcp-manager"
runtime = "python"

[components.prompt-manager-dependencies]
adapter = "payload"
build = [["{python}", "-B", "{root}/scripts/product_payload.py", "dependencies", "--profile", "prompt-manager", "--output", "{output}", "--target", "{target}"]]

[products."manager-suite/prompt-manager"]
release-tag = "aixand-prompt-manager/v{version}"
adapter = "python"
version = "0.1.0-beta"
components = ["prompt-manager", "prompt-manager-dependencies"]
dependencies = []
python = "3.12.14"
runtimes = ["python"]
stateful = true
verification = [["{command:prompt-manager}", "--help"], ["{python}", "-I", "{payload}/share/manager-suite/prompt-manager/verify.py"]]

[products."manager-suite/prompt-manager".commands.prompt-manager]
program = "bin/prompt-manager"
runtime = "python"

[components.skill-manager-dependencies]
adapter = "payload"
build = [["{python}", "-B", "{root}/scripts/product_payload.py", "dependencies", "--profile", "skill-manager", "--output", "{output}", "--target", "{target}"]]

[products."manager-suite/skill-manager"]
release-tag = "aixand-skill-manager/v{version}"
adapter = "python"
version = "0.1.0-beta"
components = ["skill-manager", "skill-manager-dependencies"]
dependencies = []
python = "3.12.14"
runtimes = ["python"]
stateful = true
verification = [["{command:skill-manager}", "--help"], ["{python}", "-I", "{payload}/share/manager-suite/skill-manager/verify.py"]]

[products."manager-suite/skill-manager".commands.skill-manager]
program = "bin/skill-manager"
runtime = "python"

[components.conversation-manager-dependencies]
adapter = "payload"
build = [["{python}", "-B", "{root}/scripts/product_payload.py", "dependencies", "--profile", "conversation-manager", "--output", "{output}", "--target", "{target}"]]

[products."manager-suite/conversation-manager"]
release-tag = "aixand-conversation-manager/v{version}"
adapter = "python"
version = "0.1.0-beta"
components = ["conversation-manager", "conversation-manager-dependencies"]
dependencies = []
python = "3.12.14"
runtimes = ["python"]
stateful = true
verification = [["{command:conversation-manager}", "--help"], ["{python}", "-I", "{payload}/share/manager-suite/conversation-manager/verify.py"]]
[products."manager-suite/conversation-manager".extras]
"aixand-conversation-manager" = ["agents", "native-codex"]

[products."manager-suite/conversation-manager".commands.conversation-manager]
program = "bin/conversation-manager"
runtime = "python"

[components.agent-manager-dependencies]
adapter = "payload"
build = [["{python}", "-B", "{root}/scripts/product_payload.py", "dependencies", "--profile", "agent-manager", "--output", "{output}", "--target", "{target}"]]

[products."manager-suite/agent-manager"]
release-tag = "aixand-agent-manager/v{version}"
adapter = "python"
version = "0.1.0-beta"
components = ["agent-manager", "agent-manager-dependencies"]
dependencies = []
python = "3.12.14"
runtimes = ["python"]
stateful = true
verification = [["{command:agent}", "--help"], ["{command:agent-manager-mcp}", "--help"], ["{python}", "-I", "{payload}/share/manager-suite/agent-manager/verify.py"]]
[products."manager-suite/agent-manager".extras]
"aixand-agent-manager" = ["mcp", "undercurrent"]

[products."manager-suite/agent-manager".commands.agent]
program = "bin/agent"
runtime = "python"

[products."manager-suite/agent-manager".commands.agent-manager-mcp]
program = "bin/agent-manager-mcp"
runtime = "python"

[groups.manager-suite]
release-tag = "aixand-manager-suite/v{version}"
version = "0.1.0-beta"
products = ["manager-suite/mcp-manager", "manager-suite/prompt-manager", "manager-suite/skill-manager", "manager-suite/conversation-manager", "manager-suite/agent-manager"]

[runtimes.python]
role = "python"
version = "3.12.14"

[runtimes.python.targets.linux-x86_64-gnu]
path = "build/runtimes/linux-x86_64-gnu.tar.gz"
sha256 = "7ce4a71285d913955a76053cc7605ea96da8ecada54dba9cf395245961816421"

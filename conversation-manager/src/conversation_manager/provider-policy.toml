# Canonical provider release policy. Regenerate packaged copies with scripts/provider_policy.py.
schema = 1
release = "2026-11-02.2"

[providers.codex.cli]
label = "Codex"
executable = "codex"
install_version = "0.166.0"
supported_range = ">=0.162.1,<0.167.0"
tested_versions = ["0.162.1", "0.164.0", "0.166.0"]
blocked_versions = []

[providers.opencode.cli]
label = "OpenCode"
executable = "opencode"
install_version = "2.2.5"
supported_range = ">=2.0.18,<3.0.0"
tested_versions = ["2.0.18", "2.1.4", "2.2.0", "2.2.5"]
blocked_versions = []

[providers.claude.cli]
label = "Claude Code"
executable = "claude"
install_version = "2.1.316"
supported_range = ">=2.1.302,<3.0.0"
tested_versions = ["2.1.302", "2.1.316"]
# SDK 0.2.168: approval callback and steering regressions in local model fixtures.
blocked_versions = ["2.1.310"]

[providers.claude.sdk]
backend = "claude-sdk"
package = "claude-agent-sdk"
install_version = "0.2.168"
supported_range = "==0.2.168"
tested_versions = ["0.2.168"]
requirements = "provider-sdk-claude.txt"

[providers.copilot.cli]
label = "GitHub Copilot"
executable = "copilot"
install_version = "1.0.105"
supported_range = ">=1.0.103,<2.0.0"
tested_versions = ["1.0.103", "1.0.104", "1.0.105"]
blocked_versions = []

[providers.copilot.sdk]
backend = "copilot-sdk"
package = "github-copilot-sdk"
install_version = "1.0.26"
supported_range = "==1.0.26"
tested_versions = ["1.0.26"]
requirements = "provider-sdk-copilot.txt"

[providers.antigravity.cli]
label = "Antigravity"
executable = "agy"
install_version = "1.4.12"
supported_range = ">=1.4.7,<2.0.0"
tested_versions = ["1.4.7", "1.4.8", "1.4.12"]
self_updates = true
blocked_versions = []

[providers.antigravity.sdk]
backend = "antigravity-sdk"
package = "google-antigravity"
install_version = "0.1.22"
supported_range = "==0.1.22"
tested_versions = ["0.1.22"]
requirements = "provider-sdk-antigravity.txt"

[backends.native-codex]
provider = "codex"
cli_required = true

[backends.opencode-native]
provider = "opencode"
cli_required = true

[backends.claude-sdk]
provider = "claude"
cli_required = true

[backends.antigravity-sdk]
provider = "antigravity"
cli_required = false

[backends.copilot-sdk]
provider = "copilot"
cli_required = true






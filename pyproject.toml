[project]
name = "aixand-manager-suite-development"
version = "0.1.0b0"
requires-python = ">=3.11,<3.15"

[dependency-groups]
runtime = [
  "aixand-lib-filesystem==0.1.0b0",
  "aixand-lib-github-source==0.1.0b0",
  "aixand-lib-local-runtime[websocket]==0.1.0b0",
  "PyYAML==6.0.3",
  "websockets==16.0",
  "jsonschema==4.25.1",
  "windows-curses>=2.4; sys_platform == 'win32'",
]
dev = ["aixand-undercurrent-sdk==0.1.0b0", "mcp==1.30.0", "aixand-carrier-mcp==0.1.0b0", "ruff==0.15.7", "setuptools==84.1.0", "wheel==0.46.2", "pip==26.2"]
sdk-backends = ["claude-agent-sdk==0.2.168", "google-antigravity==0.1.22", "github-copilot-sdk==1.0.26", "mcp>=1.30,<2"]
sdk-claude = ["claude-agent-sdk==0.2.168", "mcp==1.30.0"]
sdk-antigravity = ["google-antigravity==0.1.22", "mcp==1.30.0"]
sdk-copilot = ["github-copilot-sdk==1.0.26"]

[tool.uv]
package = false
default-groups = ["dev", "runtime"]

[tool.ruff]
target-version = "py311"
line-length = 88
extend-exclude = [".workflow-tests", ".workflow-recovery"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

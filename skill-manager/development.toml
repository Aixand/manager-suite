# Local contributor commands follow installation-template revision 2.
# Paths are consulted only with explicit --local; installed packages use wheels.
[development]
import = "skill_manager"
extras = ["github"]
tools = ["ruff==0.15.7", "setuptools==84.1.0", "wheel==0.46.2", "pip==26.2", "PyYAML==6.0.3"]

[sources]
"aixand-lib-filesystem" = "../../aixand-libraries/filesystem"
"aixand-lib-github-source" = "../../aixand-libraries/github-source"
"aixand-prompt-manager" = "../prompt-manager"

[release]
suite = ".."
product = "skill-manager"
